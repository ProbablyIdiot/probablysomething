---
title: 📰 Blog
contentTitle: Blog
layout: default
colour: "#f50070"
---

<div class="titleHolder">
	<h1>Latest Posts:</h1>
	<a href="/rss/feedGen.xml"><img src="/assets/buttons/rss-button.gif" class="titleBtn"></a>
</div>


<ul>
	{% for post in site.posts %}
		<li style="size-adjust: 300%;">
			<h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
			<p>{{ post.excerpt}}</p>
		</li>
	{% endfor %}
</ul>

<style>
	.titleHolder {
		display: flex;
		flex-flow: row nowrap;
		width: 100%;
		justify-content: space-between;
	}
</style>
